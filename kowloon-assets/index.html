<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>城砦街3Dモデル集</title>
<style>
  :root { --bg: #eef1e6; --card: #fff; --ink: #24301f; --sub: #66705e; --line: #d5dacb; --accent: #4f7a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161a14; --card: #20261d; --ink: #e6ebdf; --sub: #9aa491; --line: #343c2f; --accent: #9ccc65; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--sub); font-size: 13px; line-height: 1.6; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; max-width: 1100px; margin: 0 auto; }
  .bar button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar .village { font-weight: 600; }
  .bar .mode { margin-left: auto; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 6px 16px 32px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: inherit; font: inherit; display: flex; flex-direction: column; justify-content: flex-start; }
  .card img { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; }
  .card div { padding: 6px 8px 8px; }
  .card b { display: block; font-size: 14px; }
  .card small { color: var(--sub); font-size: 11px; }
  #viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: none; align-items: center; justify-content: center; padding: 12px; }
  #viewer.open { display: flex; }
  .panel { background: var(--card); border-radius: 12px; width: min(900px, 100%); height: min(640px, 100%); display: flex; flex-direction: column; overflow: hidden; }
  .panel header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin: 0; max-width: none; border-bottom: 1px solid var(--line); }
  .panel h2 { font-size: 16px; margin: 0; flex: 1; }
  .panel header a, .panel header button { font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: none; }
  #gl { flex: 1; min-height: 0; display: block; width: 100%; touch-action: none; }
  .info { padding: 8px 12px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); }
</style>
<script type="importmap">{ "imports": { "three": "../inaka-assets/vendor/three.module.min.js", "three/addons/": "../inaka-assets/vendor/addons/" } }</script>
</head>
<body>
<header>
  <h1>城砦街3Dモデル集</h1>
  <p>九龍城砦のような、建て増しを重ねた高層の密集街を組むための Blender 製モデル集です。3mごとに積み上げる階ユニットに、看板・室外機・配管・洗濯物・屋上のタンクやアンテナ・路地の小物を足して街並みを作ります。1単位 = 1m、Y軸が上、正面は +Z。カードを押すと3Dで回して見られます。</p>
</header>
<div class="bar" id="bar"></div>
<main id="grid"></main>
<div id="viewer">
  <div class="panel">
    <header><h2 id="vtitle"></h2><a id="vdl" download>GLBをダウンロード</a><button id="vclose">閉じる ✕</button></header>
    <canvas id="gl"></canvas>
    <div class="info" id="vinfo"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const hiRes = await fetch('models_hi.json');
const SETS = { lo: await (await fetch('models.json')).json(), hi: hiRes.ok ? await hiRes.json() : null };
let mode = location.hash === '#hi' && SETS.hi ? 'hi' : 'lo';
let models = SETS[mode];
const sfx = () => (mode === 'hi' ? '_hi' : '');
const cats = ['すべて', ...new Set(models.map((m) => m.category))];
let cat = 'すべて';
const bar = document.getElementById('bar'), grid = document.getElementById('grid');

function drawBar() {
  bar.innerHTML = '';
  for (const c of cats) {
    const b = document.createElement('button'); b.textContent = c; b.className = c === cat ? 'on' : '';
    b.onclick = () => { cat = c; drawBar(); drawGrid(); }; bar.append(b);
  }
  if (SETS.hi) for (const [k, label] of [['lo', 'ローポリ'], ['hi', 'ハイポリ']]) {
    const b = document.createElement('button'); b.textContent = label; b.className = (k === mode ? 'on ' : '') + (k === 'lo' ? 'mode' : '');
    b.onclick = () => { mode = k; models = SETS[k]; history.replaceState(null, '', k === 'hi' ? '#hi' : '#'); drawBar(); drawGrid(); }; bar.append(b);
  }
  const v = document.createElement('button'); v.textContent = '🏙 街区に組んでみる'; v.className = 'village';
  v.onclick = openVillage; bar.append(v);
}
function drawGrid() {
  grid.innerHTML = '';
  for (const m of models.filter((m) => cat === 'すべて' || m.category === cat)) {
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = `<img loading="lazy" src="preview${sfx()}/${m.name}.jpg" alt=""><div><b>${m.jp}</b><small>${m.name}.glb · ${m.size_m.join('×')}m</small></div>`;
    b.onclick = () => openModel(m); grid.append(b);
  }
}

// ---- 3D viewer
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; // so metal reflects something instead of going black
scene.environmentIntensity = 0.6;
scene.background = new THREE.Color(0x3a4258);
scene.fog = new THREE.Fog(0x3a4258, 70, 180);
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x4a4038, 1.5));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6); sun.position.set(-20, 30, 15); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 120 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(200, 48), new THREE.MeshStandardMaterial({ color: 0x4a4744, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
const loader = new GLTFLoader(), cache = {};
const load = (n) => (cache[sfx() + n] ??= loader.loadAsync(`glb${sfx()}/${n}.glb`).then((g) => { g.scene.traverse((o) => { o.castShadow = o.receiveShadow = true; }); return g.scene; }));
let holder = new THREE.Group(); scene.add(holder);
const viewer = document.getElementById('viewer');
let running = false;

function frame(size, center) {
  const d = Math.max(size, 1.5);
  camera.position.set(center.x - d * 0.9, center.y + d * 0.6, center.z + d * 1.3);
  controls.target.copy(center); controls.update();
}
function show() {
  viewer.classList.add('open'); resize();
  if (!running) { running = true; requestAnimationFrame(loop); }
}
async function openModel(m) {
  document.getElementById('vtitle').textContent = m.jp;
  const dl = document.getElementById('vdl'); dl.style.display = ''; dl.href = `glb${sfx()}/${m.name}.glb`;
  document.getElementById('vinfo').textContent = `${mode === 'hi' ? 'ハイポリ' : 'ローポリ'} · ${m.name}.glb · 幅×高さ×奥行 ${m.size_m.join(' × ')} m · ${m.tris} 三角形 · ${m.kb} KB · 色: ${m.materials.join(', ')}`;
  scene.remove(holder); holder = new THREE.Group(); scene.add(holder);
  show();
  const obj = (await load(m.name)).clone(); holder.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  frame(box.getSize(new THREE.Vector3()).length(), box.getCenter(new THREE.Vector3()));
}

// a sample block: stacks the floor modules into towers along an alley and hangs the clutter on them
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
async function openVillage() {
  document.getElementById('vtitle').textContent = '街区に組んでみる';
  document.getElementById('vdl').style.display = 'none';
  const R = rng(7), pick = (a) => a[Math.floor(R() * a.length)], P = Math.PI;
  const L = []; // [name, x, y, z, ry]
  const floors = ['floor_green', 'floor_pink', 'floor_tile', 'floor_cream', 'floor_concrete', 'floor_green'];
  const signs = Array.from({ length: 10 }, (_, i) => `sign_${i}`);
  for (const gx of [-2, -1, 1, 2]) for (let gz = -2; gz <= 2; gz++) {
    const x = gx * 6.2 + Math.sign(gx), z = gz * 6.2, n = 6 + Math.floor(R() * 7);
    const face = gx > 0 ? x - 3 : x + 3, ry = gx > 0 ? -P / 2 : P / 2; // wall facing the alley at x = 0
    for (let k = 0; k < n; k++) L.push([k ? pick(floors) : pick(['floor_shop_shutter', 'floor_shop_open']), x, k * 3, z, k ? pick([0, P]) : ry]);
    L.push(['roof_parapet', x, n * 3, z, 0]);
    for (const it of [pick(['water_tank_steel', 'water_tank_plastic']), pick(['antennas', 'roof_shack', 'satellite_dish'])]) L.push([it, x + (R() - 0.5) * 3, n * 3 + 0.2, z + (R() - 0.5) * 3, R() * 6]);
    if (Math.abs(gx) === 1) for (let k = 1; k < n; k++) {
      if (R() < 0.6) L.push(['ac_unit', face, k * 3 + 0.4, z + (R() - 0.5) * 4, ry]);
      if (R() < 0.25) L.push(['laundry_pole', face, k * 3 + 2.2, z + (R() - 0.5) * 3, ry]);
      if (R() < 0.2) L.push(['cage_balcony', face, k * 3 + 0.2, z + (R() - 0.5) * 3, ry]);
      if (k < 4 && R() < 0.7) L.push([pick(signs), face, k * 3 + 0.3 + R() * 0.7, z + (R() - 0.5) * 4.4, ry]);
    }
  }
  for (let z = -12; z <= 12; z += 6) L.push(['alley_floor', 0, 0, z, 0]);
  for (let k = 0; k < 9; k++) L.push(['cable_span', 0, 4.5 + R() * 4, -11 + k * 2.7, 0]);
  for (const [n, z] of [['hawker_stall', 4], ['stool_stack', -3], ['trash_bags', -7], ['crates', 8], ['foam_boxes', -9]]) L.push([n, (R() - 0.5) * 0.6, 0, z, R() * 6]);
  for (let z = -11; z <= 12; z += 4) L.push(['lantern_red', 0, 3.4, z, 0]);
  document.getElementById('vinfo').textContent = `${new Set(L.map((l) => l[0])).size}種類・${L.length}個のモデルを実寸で組んだサンプルです。ドラッグで回転、ピンチ/ホイールで拡大縮小。`;
  scene.remove(holder); holder = new THREE.Group(); scene.add(holder);
  show(); frame(34, new THREE.Vector3(0, 12, 0));
  const objs = await Promise.all(L.map((l) => load(l[0])));
  L.forEach(([, x, y, z, ry], i) => { const o = objs[i].clone(); o.position.set(x, y, z); o.rotation.y = ry; holder.add(o); });
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
function loop() {
  if (!viewer.classList.contains('open')) { running = false; return; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
const close = () => viewer.classList.remove('open');
document.getElementById('vclose').onclick = close;
viewer.onclick = (e) => { if (e.target === viewer) close(); };
addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
drawBar(); drawGrid();
</script>
</body>
</html>
