# Builds the おべんとうポン！ store app for Android (obento-app/): a debug APK to try on a phone and
# the release bundle (.aab) for Play Console. The bundle is signed when the keystore secrets are set
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# see obento-app/README.md. Both files are attached to the run as artifacts.
name: obento android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['obento-app/**', '.github/workflows/obento-android.yml']
permissions:
  contents: read
concurrency:
  group: obento-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: obento-app
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: obento-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obento-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image tools (icons and launch screens)
        run: python -m pip install --quiet pillow
      - run: npm ci
      - name: Game logic tests
        run: npm test
      - name: Web files and native settings
        run: npm run sync
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret: the release bundle is unsigned (fine for a test build)."
          fi
      - name: Build
        working-directory: obento-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: obento-pon-android
          path: |
            obento-app/android/app/build/outputs/apk/debug/*.apk
            obento-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
