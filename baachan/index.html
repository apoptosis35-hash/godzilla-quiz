<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ばあちゃんターボ</title>
<meta name="description" content="孫を背負ったおばあちゃんが商店街を爆走し、なんでも吹っ飛ばす3Dランゲーム">
<meta name="theme-color" content="#ffb84d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ばあちゃんターボ">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, noimageindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="hud-row">
    <button id="btn-pause" class="chip" aria-label="一時停止"><b class="pz">II</b></button>
    <div class="hud-mid">
      <div class="chip score">SCORE <b id="score">0</b></div>
      <div class="chip spd"><b id="kmh">0</b><small>km/h</small></div>
    </div>
    <canvas id="minimap" width="240" height="240"></canvas>
  </div>
  <div id="gauge"><div id="gauge-fill"></div><span id="gauge-label">ばあちゃんゲージ</span></div>
  <div id="objective"><i id="obj-arrow">▲</i><span id="obj-text"></span></div>
</div>
<div id="combo"><b id="combo-n">0</b><span>COMBO</span><em id="combo-x">×1.0</em></div>
<button id="btn-tea" aria-label="お茶ブースト"><span>🍵</span><small>お茶</small><b id="tea-cd"></b></button>

<div id="bubbles"></div>
<div id="pops"></div>
<div id="toasts"></div>
<div id="omikuji"></div>
<div id="steam"></div>
<div id="howto">
  <div><span>←→</span>ドラッグでハンドル</div>
  <div><span>↑</span>上にはらってジャンプ</div>
  <div><span>🍵</span>お茶でブースト</div>
  <p>町じゅう自由に爆走！ なんでも吹っ飛ばせ！</p>
</div>
<div id="letterbox"><div class="lb top"></div><div class="lb bot"><div id="subtitle"></div></div></div>
<button id="skip">スキップ ▶▶</button>
<div id="title-slam"><span class="l1">ばあちゃん</span><span class="l2">ターボ</span></div>

<section id="boot" class="ov on">
  <div class="boot-in">
    <div class="logo small"><span class="l1">ばあちゃん</span><span class="l2">ターボ</span></div>
    <div class="load"><div id="load-fill"></div></div>
    <div id="load-msg">町を準備中…</div>
  </div>
</section>

<section id="title" class="ov">
  <div class="t-top">
    <div class="kicker">孫をせおって 町じゅう自由に爆走！</div>
    <h1 class="logo"><span class="l1">ばあちゃん</span><span class="l2">ターボ</span></h1>
  </div>
  <div class="t-bot">
    <button id="btn-ach" class="panel t-achbtn"><div id="t-ach" class="t-rank"></div><div id="t-next" class="t-next"></div></button>
    <ul id="t-achlist" class="achlist"></ul>
    <div class="sel">
      <button id="rider-prev" class="arr">◀</button><div><small>背中</small><b id="sel-rider"></b></div><button id="rider-next" class="arr">▶</button>
    </div>
    <div class="sel">
      <button id="outfit-prev" class="arr">◀</button><div><small>服</small><b id="sel-outfit"></b></div><button id="outfit-next" class="arr">▶</button>
    </div>
    <button id="btn-start" class="big">しっかりつかまる！</button>
    <div class="best" id="best"></div>
    <div class="toggles">
      <button id="btn-sound" class="tg on">🔊 音</button>
      <button id="btn-voice" class="tg on">🗣️ ばあちゃんの声</button>
    </div>
  </div>
</section>

<section id="pause" class="ov dim">
  <div class="card">
    <h2>ひとやすみ</h2>
    <p class="pz-line">「お茶でも飲むかい？」</p>
    <ul class="r-stats" id="p-stats"></ul>
    <button id="btn-resume" class="big">再開する</button>
    <ul class="achlist on" id="p-ach"></ul>
    <button id="btn-quit" class="sub-btn">タイトルへ</button>
  </div>
</section>

<script type="module" src="js/main.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
