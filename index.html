<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゴジラクイズゲーム(家族用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: 防衛隊の監視モニター風。縦一列のアプリ画面 + 下部タブ。暗い深海に放射熱線の青が光る単一ダークテーマ */
:root{
  color-scheme: dark;
  --abyss:#06090f;
  --panel:#0e1520;
  --panel-2:#142030;
  --line:#22324a;
  --fg:#e6eef8;
  --muted:#8597ad;
  --atomic:#4fd6ff;
  --atomic-hi:#b8f4ff;
  --alert:#ffb224;
  --ok:#3fe08c;
  --ng:#ff5a5a;
  --r-n:#9aa7b5; --r-r:#4f9dff; --r-sr:#c77dff; --r-ssr:#ffcc33;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:10px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--abyss);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse 120% 50% at 50% -10%, rgba(79,214,255,.13), transparent 60%),
    linear-gradient(rgba(79,214,255,.035) 1px, transparent 1px),linear-gradient(90deg, rgba(79,214,255,.035) 1px, transparent 1px);
  background-size:auto,28px 28px,28px 28px;background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--atomic);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px 8px;
  background:linear-gradient(var(--abyss) 70%, rgba(6,9,15,.0));display:grid;gap:6px}
.hud-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.lv-badge{font-family:var(--f-mono);background:var(--atomic);color:#03121a;font-weight:700;border-radius:6px;padding:1px 7px;font-size:13px;white-space:nowrap}
.lv-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:13px;white-space:nowrap}
.xpbar{height:4px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--atomic),var(--atomic-hi));border-radius:4px;transition:width .5s}

/* Generic */
h2.sec{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.04em;margin:0;display:flex;align-items:baseline;gap:8px}
h2.sec small{font-family:var(--f-mono);font-size:11px;color:var(--atomic);letter-spacing:.15em}
.stack{display:grid;gap:22px;padding-top:6px}
.block{display:grid;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);transition:transform .08s, filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--atomic);color:#03121a;border-color:transparent;box-shadow:0 0 18px rgba(79,214,255,.35)}
.btn.alert{background:var(--alert);color:#241500;border-color:transparent}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Hero */
.hero{display:grid;gap:4px;padding-top:4px}
.hero svg{width:100%;max-width:100%;height:auto;display:block}
.hero-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.date{font-family:var(--f-mono);color:var(--muted);font-size:13px;letter-spacing:.08em}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;background:rgba(255,178,36,.14);color:var(--alert);border:1px solid rgba(255,178,36,.4)}

/* Login strip */
.login-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lday{border:1px solid var(--line);border-radius:7px;padding:6px 2px;text-align:center;background:var(--panel);font-size:11px;line-height:1.3;position:relative;min-width:0}
.lday b{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
.lday .ic{font-size:18px;display:block;margin:2px 0}
.lday.done{opacity:.45}
.lday.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:var(--ok);font-weight:900}
.lday.today{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert) inset}
.lday.big{background:linear-gradient(160deg,rgba(199,125,255,.25),var(--panel))}

/* Daily quiz */
.daily{border:1px solid rgba(79,214,255,.45);background:linear-gradient(140deg,rgba(79,214,255,.14),var(--panel) 55%);border-radius:var(--radius);padding:16px;display:grid;gap:10px;position:relative;overflow:hidden}
.daily .big{font-family:var(--f-display);font-size:22px;line-height:1.3}
.streak{display:flex;align-items:center;gap:10px}
.flame{font-size:30px;filter:drop-shadow(0 0 8px rgba(255,140,40,.6))}
.streak .n{font-family:var(--f-mono);font-size:28px;color:var(--alert);line-height:1}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);display:block;max-width:100%}
.cal i.on{background:var(--atomic);border-color:var(--atomic);box-shadow:0 0 6px rgba(79,214,255,.6)}
.cal i.perfect{background:var(--alert);border-color:var(--alert)}
.cal i.today{outline:1px solid var(--fg);outline-offset:1px}
.countdown{font-family:var(--f-mono);font-size:24px;color:var(--atomic-hi);letter-spacing:.06em}

/* Fortune */
.fortune{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fortune .emo{font-size:46px;width:72px;height:72px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(79,214,255,.25),transparent 70%)}
.fortune .luck{font-family:var(--f-display);font-size:24px;color:var(--alert)}
.seal{width:100%;border:1px dashed var(--alert);background:rgba(255,178,36,.06);border-radius:var(--radius);padding:18px;display:grid;gap:4px;text-align:center}

/* Missions */
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mission:last-child{border-bottom:0}
.bar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;grid-column:1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.mission .btn{padding:6px 12px;font-size:13px;grid-row:span 2}
.claimed{color:var(--muted);font-size:12px;grid-row:span 2}

/* Play modes */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;width:100%}
.mode .ico{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:var(--panel-2);border-radius:8px}
.mode h3{margin:0;font-size:16px}
.mode p{margin:0;font-size:12.5px;color:var(--muted)}
.mode .rec{font-family:var(--f-mono);font-size:12px;color:var(--atomic);text-align:right}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;display:grid;gap:2px}
.cat b{font-size:14px}
.cat span{font-size:11.5px;color:var(--muted)}
.cat.lucky{border-color:var(--alert)}

/* Quiz overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--abyss);overflow-y:auto;
  background-image:radial-gradient(ellipse 120% 40% at 50% 0%, rgba(79,214,255,.12), transparent 60%)}
.overlay .inner{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qmode{font-family:var(--f-display);font-size:15px}
.qprog{font-family:var(--f-mono);color:var(--muted)}
.lives{letter-spacing:2px}
.timer{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--atomic);transition:width .1s linear}
.timer.warn i{background:var(--ng)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;display:grid;gap:8px;min-height:120px}
.qcat{font-size:11.5px;color:var(--atomic);font-weight:700;letter-spacing:.08em}
.qtext{font-size:18px;font-weight:700;line-height:1.55;text-wrap:balance}
.choices{display:grid;gap:9px}
.choice{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:15.5px;font-weight:700;width:100%}
.choice .k{font-family:var(--f-mono);width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--abyss);color:var(--atomic);font-size:14px}
.choice.correct{border-color:var(--ok);background:rgba(63,224,140,.14)}
.choice.correct .k{background:var(--ok);color:#03140a}
.choice.wrong{border-color:var(--ng);background:rgba(255,90,90,.13)}
.choice.wrong .k{background:var(--ng);color:#1a0303}
.choice:disabled{cursor:default}
.combo{font-family:var(--f-display);color:var(--alert);font-size:14px}
.feedback{border-radius:var(--radius);padding:14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--panel)}
.feedback .verdict{font-family:var(--f-display);font-size:22px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.ng .verdict{color:var(--ng)}
.gain{font-family:var(--f-mono);color:var(--alert);font-size:13px}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.flash.ok{animation:fl .5s ease-out;background:radial-gradient(circle,rgba(63,224,140,.25),transparent 70%)}
.flash.ng{animation:fl .5s ease-out;background:radial-gradient(circle,rgba(255,90,90,.25),transparent 70%)}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

/* Results */
.result-head{text-align:center;display:grid;gap:4px;padding-top:10px}
.result-head .score{font-family:var(--f-display);font-size:54px;line-height:1.1;color:var(--atomic-hi);text-shadow:0 0 24px rgba(79,214,255,.5)}
.result-head .rank{font-family:var(--f-display);font-size:20px;color:var(--alert)}
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.reward{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.reward b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--alert)}
.reward span{font-size:12px;color:var(--muted)}
.review{display:grid;gap:6px}
.review div{font-size:13px;padding:8px 10px;border-radius:7px;background:var(--panel);border-left:3px solid var(--ok)}
.review div.x{border-left-color:var(--ng)}

/* Cards */
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:480px){.zgrid{grid-template-columns:repeat(4,1fr)}}
.kcard{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:9px;border:2px solid var(--rc);overflow:hidden;
  background:radial-gradient(circle at 50% 38%, hsla(var(--h),80%,55%,.45), hsla(var(--h),60%,12%,1) 70%);
  display:grid;grid-template-rows:auto 1fr auto;padding:5px;text-align:center;width:100%}
.kcard .rar{justify-self:start;font-family:var(--f-mono);font-size:10px;font-weight:700;background:var(--rc);color:#0a0a0a;border-radius:3px;padding:0 5px;line-height:1.5}
.kcard .art{font-size:clamp(30px,10vw,48px);display:grid;place-items:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));min-height:0;overflow:hidden}
.kcard.has-img{padding:0}
.kcard.has-img .art{position:absolute;inset:0;filter:none}
.kcard.has-img .art img{width:100%;height:100%;object-fit:cover;display:block}
.kcard.has-img .rar{position:relative;z-index:1;margin:5px}
.kcard.has-img .nm{position:absolute;left:5px;right:5px;bottom:5px;z-index:1}
.kcard.has-img .st{z-index:1}
.imgtools{display:grid;grid-template-columns:1fr auto;gap:8px}
.imgtools label{display:grid;place-items:center}
.kcard .nm{font-size:11px;font-weight:900;line-height:1.25;background:rgba(0,0,0,.55);border-radius:4px;padding:3px 2px;color:#fff;overflow-wrap:anywhere}
.kcard .st{position:absolute;top:5px;right:6px;font-size:9px;color:var(--r-ssr);letter-spacing:-1px}
.kcard.locked{--h:215 !important;border-color:var(--line);background:var(--panel)}
.kcard.locked .art{filter:brightness(0) opacity(.55)}
.kcard.locked .rar{background:var(--line);color:var(--muted)}
.kcard.r-ssr:not(.locked)::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(255,220,120,.25) 52%,transparent 65%);background-size:250% 100%;animation:sheen 3.2s linear infinite;mix-blend-mode:screen}
.kcard.r-sr:not(.locked)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);background-size:250% 100%;animation:sheen 4.5s linear infinite}
@keyframes sheen{0%{background-position:150% 0}100%{background-position:-100% 0}}
.r-n{--rc:var(--r-n)} .r-r{--rc:var(--r-r)} .r-sr{--rc:var(--r-sr)} .r-ssr{--rc:var(--r-ssr)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--atomic);color:#03121a;border-color:transparent;font-weight:700}
.progress-big{display:flex;align-items:baseline;gap:8px}
.progress-big b{font-family:var(--f-display);font-size:30px;color:var(--atomic-hi)}

/* Gacha */
.machine{display:grid;place-items:center;padding:18px 0 6px}
.capsule{width:130px;height:130px;border-radius:50%;position:relative;
  background:linear-gradient(180deg,var(--cap,#4fd6ff) 0 50%, #e8eef5 50% 100%);box-shadow:0 0 0 4px #0b111a, 0 0 40px rgba(79,214,255,.35);display:grid;place-items:center}
.capsule::before{content:"";position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:#0b111a}
.capsule::after{content:"";position:absolute;top:16px;left:26px;width:30px;height:16px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-25deg)}
.capsule .lbl{position:relative;z-index:1;font-family:var(--f-display);font-size:14px;color:#0b111a;background:#fff;border-radius:4px;padding:0 6px;margin-top:2px}
.capsule.shake{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg) scale(1.05)}}
.rates{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rates span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rc);color:var(--rc);border-radius:4px;padding:0 6px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbtns .btn{display:grid;gap:0;padding:10px 8px;line-height:1.35}
.gbtns .btn small{font-weight:400;font-size:11.5px;opacity:.85}
.pull-result{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pull-result.one{grid-template-columns:minmax(0,180px);justify-content:center}
.pull-result .kcard{animation:pop .45s backwards}
.pull-result .new{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:9px;background:var(--ng);color:#fff;padding:0 4px;border-radius:3px;z-index:2}
@keyframes pop{0%{transform:scale(.4) rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}

/* Records */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-family:var(--f-mono);font-size:22px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);display:grid;gap:1px}
.ach b{font-size:13.5px}
.ach span{font-size:11.5px;color:var(--muted)}
.ach em{font-style:normal;font-size:11px;color:var(--alert)}
.ach.on{border-color:rgba(255,178,36,.6);background:linear-gradient(150deg,rgba(255,178,36,.13),var(--panel))}
.ach:not(.on){opacity:.6}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,15,23,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:8px 0 9px;display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative}
.tabbar button .i{font-size:21px;line-height:1.2}
.tabbar button[aria-current="page"]{color:var(--atomic)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--atomic);box-shadow:0 0 8px var(--atomic)}
.dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ng);box-shadow:0 0 0 2px var(--abyss)}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:70;background:rgba(2,4,8,.78);display:grid;place-items:center;padding:16px}
.modal .box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px;text-align:center;max-height:90vh;overflow-y:auto;animation:pop .3s}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.modal .bigcard{width:min(220px,70vw);margin:0 auto}
.modal .bigcard .kcard .art{font-size:84px}
.modal .bigcard .kcard .nm{font-size:15px}
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:90;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{background:var(--panel-2);border:1px solid var(--alert);color:var(--fg);border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .3s, tout .4s 2.6s forwards;max-width:100%}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.foot{font-size:11px;color:var(--muted);text-align:center;padding-top:10px}
.fin-glow{animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 3px rgba(79,214,255,.5))}to{filter:drop-shadow(0 0 14px rgba(79,214,255,.95))}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

</head><body>
<div class="app" id="app">
  <header class="hud" id="hud"></header>
  <main id="view"></main>

const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function dkey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shiftKey(n){const d=new Date();d.setDate(d.getDate()+n);return dkey(d)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const isWeekend = ()=>{const d=new Date().getDay();return d===0||d===6};

async function loadWP(){

    const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=480&pilicense=any&pilimit=50&titles='+encodeURIComponent(titles.join('|'));
    const d=await (await fetch(u)).json();const q=d.query||{};const alias={};
    for(const x of (q.normalized||[]))alias[x.from]=x.to;for(const x of (q.redirects||[]))alias[x.from]=x.to;
    const byTitle={};for(const p of Object.values(q.pages||{}))if(p.thumbnail)byTitle[p.title]=p.thumbnail.source;
    const resolve=t=>{let s=t;for(let i=0;i<3&&alias[s];i++)s=alias[s];return s};
    const m={};for(const [id,t] of Object.entries(WP_TITLES)){const s=byTitle[resolve(t)];if(s)m[id]=s}
    if(!Object.keys(m).length)throw new Error('no images');
    WP=m;try{localStorage.setItem(WP_KEY,JSON.stringify({t:Date.now(),m}))}catch(e){}

function setCardImage(id,file){
  if(!file||!/^image\//.test(file.type)){toast('画像ファイルを選んでください');return}
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const W=360,H=480,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
      const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      const prev=IMG[id];IMG[id]=cv.toDataURL('image/jpeg',.82);
      if(saveImg())toast('カードに画像を設定しました');else{if(prev)IMG[id]=prev;else delete IMG[id];toast('保存容量がいっぱいです。ほかのカードの画像を外してください')}
      render();showCard(CARD[id])};
    im.onerror=()=>toast('この画像は読み込めませんでした');im.src=rd.result};
  rd.readAsDataURL(file);
}

function ensureDay(){
  const k=today();
  if(S.day&&S.day.key===k) return false;
  const r=rng(hash('day'+k));
  const ms=shuffle(MISSIONS,r).slice(0,3).map(m=>({id:m.id,p:0,done:false}));
  const catKeys=Object.keys(CATS);
  S.day={key:k,missions:ms,allBonus:false,loginClaimed:false,loginIdx:0,
    fortune:{revealed:false,card:CARDS[Math.floor(r()*CARDS.length)].id,luck:Math.floor(r()*LUCKS.length),cat:catKeys[Math.floor(r()*catKeys.length)]},
    dailyDone:false,dailyScore:0};
  // ログイン処理
  const L=S.login;
  if(L.last!==k){L.streak=(L.last===shiftKey(-1))?L.streak+1:1;L.count++;L.best=Math.max(L.best,L.streak);L.last=k}
  S.day.loginIdx=(L.count-1)%7;
  // デイリーのストリークが途切れていたら0に
  if(S.daily.last&&S.daily.last!==k&&S.daily.last!==shiftKey(-1)) S.daily.streak=0;
  save();
  return true;
}

function grant(r,mult=1){const parts=[];
  if(r.coins){const n=Math.round(r.coins*mult);S.coins+=n;parts.push('🪙'+n)}
  if(r.tickets){S.tickets+=r.tickets;parts.push('🎫×'+r.tickets)}
  if(r.srTickets){S.srTickets+=r.srTickets;parts.push('💜SR確定×'+r.srTickets)}
  return parts.join(' ');
}
function rewardText(r){return [r.coins?'🪙'+r.coins:'',r.tickets?'🎫×'+r.tickets:'',r.srTickets?'💜SR確定×'+r.srTickets:''].filter(Boolean).join(' ')}
function xpNeed(l){return 80+l*40}
function titleOf(l){let t=TITLES[0][1];for(const [lv,n] of TITLES) if(l>=lv) t=n;return t}
function addXP(n){S.xp+=n;let ups=0;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;ups++;S.tickets++}
  if(ups) toast(`レベルアップ！ Lv.${S.level}「${titleOf(S.level)}」 🎫×${ups}`);return ups}
function coinMult(cat){let m=1;if(isWeekend())m*=1.5;if(isGodzillaDay())m*=2;if(cat&&S.day.fortune.revealed&&S.day.fortune.cat===cat)m*=1.5;return m}

function track(ev,val=1){
  for(const m of S.day.missions){const d=MISSIONS.find(x=>x.id===m.id);if(!d||d.ev!==ev||m.done)continue;
    m.p=d.max?Math.max(m.p,val):m.p+val; if(m.p>=d.g){m.p=d.g}}
}
function checkAch(){
  for(const a of ACH){if(!S.ach[a.id]&&a.c(S)){S.ach[a.id]=today();const g=grant(a.r);toast(`🏆 実績「${a.n}」達成！ ${g}`)}}
}

  const seq={ok:[[660,.08],[990,.12]],ng:[[200,.18],[150,.2]],tap:[[520,.04]],gacha:[[400,.06],[500,.06],[600,.06],[800,.15]],ssr:[[523,.1],[659,.1],[784,.1],[1047,.3]],up:[[600,.08],[900,.08],[1200,.16]]}[type]||[];

}catch(e){} }

let Q=null, qTimer=null;
const PER_Q=20;
function startQuiz(mode,cat){
  let list;
  if(mode==='daily'){if(S.day.dailyDone)return;list=shuffle(QS,rng(hash('daily'+today()))).slice(0,5)}
  else if(mode==='practice'){list=shuffle(cat==='all'?QS:QS.filter(q=>q[0]===cat)).slice(0,10)}
  else list=shuffle(QS);
  Q={mode,cat,list,idx:0,correct:0,combo:0,maxCombo:0,coins:0,xp:0,lives:mode==='survival'?3:0,
     total:mode==='ta'?60:0,qLeft:PER_Q,locked:false,log:[],startedAt:Date.now()};
  $('#quiz').hidden=false;document.body.style.overflow='hidden';
  clearInterval(qTimer);qTimer=setInterval(tick,100);

}
function curQ(){return Q.list[Q.idx]}
function showQ(){
  const q=curQ(); Q.order=shuffle([0,1,2,3]); Q.locked=false; Q.qLeft=PER_Q;
  const label={daily:'デイリークイズ',practice:Q.cat==='all'?'ぜんぶミックス':(CATS[Q.cat]||{}).n,ta:'タイムアタック',survival:'サバイバル'}[Q.mode];

  $('#quizInner').innerHTML=`<div class="qtop"><span class="qmode">${label}</span>${prog}<span class="spacer"></span>
    ${Q.combo>=2?`<span class="combo">${Q.combo} COMBO</span>`:''}<span class="gain">🪙${Q.coins}</span>
    ${Q.mode!=='daily'?'<button class="btn ghost" style="padding:4px 10px;font-size:13px" data-act="quit">終了</button>':''}</div>
   <div class="timer" id="tbar"><i style="width:100%"></i></div>

   <div class="choices">${Q.order.map((o,i)=>`<button class="choice" data-act="ans" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(q[3][o])}</span></button>`).join('')}</div>

function tick(){
  if(!Q||Q.done)return;
  if(Q.mode==='ta'){Q.total-=.1;const el=$('#tleft');if(el)el.textContent=Math.max(0,Math.ceil(Q.total))+'秒';
    const b=$('#tbar');if(b){b.firstElementChild.style.width=Math.max(0,Q.total/60*100)+'%';b.classList.toggle('warn',Q.total<10)}
    if(Q.total<=0){finish();}return}
  if(Q.locked)return;
  Q.qLeft-=.1;const b=$('#tbar');if(b){b.firstElementChild.style.width=Math.max(0,Q.qLeft/PER_Q*100)+'%';b.classList.toggle('warn',Q.qLeft<5)}
  if(Q.qLeft<=0)answer(-1);
}
function answer(i){
  if(!Q||Q.locked)return;Q.locked=true;
  const q=curQ();const ok=i>=0&&Q.order[i]===0;
  document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(Q.order[j]===0)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});
  S.stats.answered++;
  let gained=0;
  if(ok){Q.correct++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);S.stats.correct++;S.stats.bestCombo=Math.max(S.stats.bestCombo,Q.combo);
    S.stats.catCorrect[q[0]]=(S.stats.catCorrect[q[0]]||0)+1;
    const base={daily:20,practice:10,ta:5,survival:8}[Q.mode];const comboB=Q.mode==='ta'?0:Math.min(Q.combo-1,5)*2;
    gained=Math.round((base+comboB+(q[1]-1)*2)*coinMult(q[0]));Q.coins+=gained;Q.xp+=10+q[1]*2;
    track('correct');track('combo',Q.combo);if(S.day.fortune.revealed&&q[0]===S.day.fortune.cat)track('lucky');
    beep('ok');flash('ok');
  }else{Q.combo=0;Q.xp+=2;if(Q.mode==='survival')Q.lives--;beep('ng');flash('ng')}
  Q.log.push({q,ok});
  if(Q.mode==='ta'){setTimeout(()=>{if(!Q||Q.done)return;nextQ()},ok?350:800);return}
  const last=(Q.mode==='survival'&&Q.lives<=0)||((Q.mode==='daily'||Q.mode==='practice')&&Q.idx>=Q.list.length-1);
  $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ng'}"><div class="row"><span class="verdict">${ok?'正解！':i<0?'時間切れ':'ざんねん'}</span><span class="spacer"></span>${ok?`<span class="gain">+🪙${gained}</span>`:''}</div>
   ${ok?'':`<div class="small">正解は「<b>${esc(q[3][0])}</b>」</div>`}<div class="small muted">${esc(q[4])}</div>
   <button class="btn primary wide" data-act="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function flash(k){const f=$('#flash');f.className='flash';void f.offsetWidth;f.className='flash '+k}
function nextQ(){
  if(Q.mode==='survival'&&Q.lives<=0)return finish();
  Q.idx++;
  if(Q.mode==='daily'||Q.mode==='practice'){if(Q.idx>=Q.list.length)return finish()}
  else if(Q.idx>=Q.list.length){Q.list=Q.list.concat(shuffle(QS))}
  showQ();
}
function finish(){
  if(!Q||Q.done)return;Q.done=true;clearInterval(qTimer);
  const lines=[];let bonus={};
  S.coins+=Q.coins;
  const ups=addXP(Q.xp);if(ups)beep('up');
  if(Q.mode==='daily'){
    const k=today();S.day.dailyDone=true;S.day.dailyScore=Q.correct;S.daily.history[k]=Q.correct;
    S.daily.streak=(S.daily.last===shiftKey(-1))?S.daily.streak+1:(S.daily.last===k?S.daily.streak:1);
    S.daily.last=k;S.daily.best=Math.max(S.daily.best,S.daily.streak);
    if(Q.correct===Q.list.length){S.stats.dailyPerfect++;bonus.coins=100;S.coins+=100;lines.push('全問正解ボーナス 🪙100')}
    const sb=Math.min(S.daily.streak,10)*10;S.coins+=sb;lines.push(`連続${S.daily.streak}日ボーナス 🪙${sb}`);
    track('daily');
  }
  if(Q.mode==='ta'){S.stats.taBest=Math.max(S.stats.taBest,Q.correct);track('ta');track('taScore',Q.correct)}
  if(Q.mode==='survival'){S.stats.survBest=Math.max(S.stats.survBest,Q.correct);track('svScore',Q.correct)}
  if(Q.mode==='practice'&&Q.idx>=Q.list.length-1)track('practice');
  checkAch();save();
  const n=Q.mode==='daily'||Q.mode==='practice'?Q.list.length:Q.log.length;
  const ratio=n?Q.correct/n:0;
  const rank=Q.mode==='ta'?(Q.correct>=20?'怪獣王':Q.correct>=12?'Gフォース級':Q.correct>=6?'防衛隊員級':'見習い級')
    :Q.mode==='survival'?(Q.correct>=20?'不死身':Q.correct>=10?'歴戦の勇士':Q.correct>=5?'粘り強い':'これから')
    :ratio===1?'パーフェクト！':ratio>=.7?'お見事！':ratio>=.4?'あと一歩':'また挑戦しよう';
  $('#quizInner').innerHTML=`<div class="result-head"><span class="small muted">${{daily:'デイリークイズ',practice:'ジャンル別クイズ',ta:'タイムアタック',survival:'サバイバル'}[Q.mode]} 結果</span>
    <div class="score num">${Q.correct}${Q.mode==='daily'||Q.mode==='practice'?`<span style="font-size:24px;color:var(--muted)"> / ${Q.list.length}</span>`:'<span style="font-size:24px;color:var(--muted)"> 問正解</span>'}</div><div class="rank">${rank}</div></div>
   <div class="rewards"><div class="reward"><b>🪙${Q.coins}</b><span>正解コイン</span></div><div class="reward"><b>${Q.xp}</b><span>経験値</span></div><div class="reward"><b>${Q.maxCombo}</b><span>最大コンボ</span></div></div>
   ${lines.length?`<div class="panel small" style="display:grid;gap:2px">${lines.map(l=>`<div>✨ ${l}</div>`).join('')}</div>`:''}
   ${Q.mode==='daily'?`<p class="small muted" style="text-align:center;margin:0">🔥 ストリーク ${S.daily.streak}日。明日の0時に新しい5問が届きます。</p>`:''}
   <div class="row"><button class="btn primary" style="flex:1" data-act="close">ホームへ</button>${Q.mode!=='daily'?`<button class="btn" style="flex:1" data-act="again">もう一度</button>`:''}</div>
   <h2 class="sec" style="margin-top:6px">ふりかえり</h2>
   <div class="review">${Q.log.map(l=>`<div class="${l.ok?'':'x'}">${l.ok?'⭕':'❌'} ${esc(l.q[2])}<br><span class="muted">答え: ${esc(l.q[3][0])}</span></div>`).join('')}</div>`;
  $('#quiz').scrollTop=0;
}
function closeQuiz(){clearInterval(qTimer);if(Q&&!Q.done)finish();$('#quiz').hidden=true;document.body.style.overflow='';Q=null;render()}

/* ============ ガチャ ============ */
function rollRarity(r,minSR){let w=Object.entries(RARITY);if(minSR)w=w.filter(([k])=>k==='SR'||k==='SSR');
  const tot=w.reduce((a,[,v])=>a+v.w,0);let x=r()*tot;for(const [k,v] of w){if((x-=v.w)<0)return k}return w[w.length-1][0]}
function pull(kind){
  let n=1,minSRLast=false,minSRAll=false;
  if(kind==='ticket'){if(S.tickets<1)return;S.tickets--}
  else if(kind==='coin1'){if(S.coins<100)return;S.coins-=100}
  else if(kind==='coin10'){if(S.coins<900)return;S.coins-=900;n=10;minSRLast=true}
  else if(kind==='sr'){if(S.srTickets<1)return;S.srTickets--;minSRAll=true}
  const items=[];let refund=0;
  for(let i=0;i<n;i++){
    let rar=rollRarity(Math.random,minSRAll||(minSRLast&&i===n-1&&!items.some(it=>['SR','SSR'].includes(CARD[it.id].r))));
    const pool=CARDS.filter(c=>c.r===rar);const c=pool[Math.floor(Math.random()*pool.length)];
    const isNew=!S.cards[c.id];
    if((S.cards[c.id]||0)>=5){refund+=30;S.coins+=30}else S.cards[c.id]=(S.cards[c.id]||0)+1;
    items.push({id:c.id,isNew});
  }
  S.stats.gachaCount+=n;track('gacha',n);
  const order=['N','R','SR','SSR'];const best=items.map(it=>CARD[it.id].r).sort((a,b)=>order.indexOf(b)-order.indexOf(a))[0];
  lastPull={items,refund,best};
  checkAch();save();
  const cap=$('#cap');const caps={SSR:'#ffcc33',SR:'#c77dff',R:'#4f9dff',N:'#9aa7b5'};
  $('#pullArea').innerHTML='';document.querySelectorAll('.gbtns .btn').forEach(b=>b.disabled=true);
  beep('gacha');
  if(cap&&!matchMedia('(prefers-reduced-motion: reduce)').matches){cap.classList.remove('shake');void cap.offsetWidth;cap.classList.add('shake');cap.style.setProperty('--cap',caps[best])}
  setTimeout(()=>{if(best==='SSR')beep('ssr');renderHUD();renderTabs();viewGacha();
    if(n===1){const c=CARD[items[0].id];showCard(c,items[0].isNew?'NEW！':'')}},950);
}
function showCard(c,head){
  const cnt=S.cards[c.id]||0;
  openModal(`${head?`<div style="font-family:var(--f-display);color:var(--alert);font-size:18px">${head}</div>`:''}<div class="bigcard">${cardHTML(c,{owned:!!cnt})}</div>
   ${cnt?`<h3>${esc(c.n)}</h3><div class="small" style="color:var(--atomic)">${esc(c.f)}</div>${WP[c.id]&&!IMG[c.id]?`<div class="small muted">画像出典: <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(WP_TITLES[c.id].replace(/ /g,'_'))}" target="_blank" rel="noopener" style="color:var(--atomic)">Wikipedia「${esc(WP_TITLES[c.id])}」</a></div>`:''}<p style="margin:0;text-align:left" class="small">${esc(c.d)}</p><div class="small muted">所持 ${cnt}枚 ・ ★${Math.min(cnt,5)}/5</div>
     <div class="imgtools"><label class="btn" for="imgIn">🖼️ ${IMG[c.id]?'画像を変更':'自分の画像を設定'}</label>${IMG[c.id]?`<button class="btn ghost" data-act="imgdel" data-id="${c.id}">外す</button>`:''}</div>
     <input type="file" id="imgIn" accept="image/*" data-id="${c.id}" hidden>
     <div class="small muted">手持ちの画像ファイルをカードの絵にできます。画像はこのブラウザの中だけに保存されます。</div>`
     :`<h3>？？？</h3><p class="small muted" style="margin:0">まだ出会っていない怪獣です。レア度 ${c.r}。ガチャで探そう。</p>`}
   <button class="btn primary wide" data-act="mclose">閉じる</button>`);
}

/* ============ 操作 ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;resetArm=false;beep('tap');render();window.scrollTo(0,0);return}
  const a=t.dataset.act;const D=S.day;
  switch(a){
    case 'login':{if(D.loginClaimed)break;const r=LOGIN[D.loginIdx];D.loginClaimed=true;grant({[r.t]:r.n});beep('up');
      openModal(`<div style="font-size:48px">${r.ic}</div><h3>ログインボーナス ${D.loginIdx+1}日目</h3><p style="margin:0">${r.t==='coins'?'🪙'+r.n+' コイン':r.t==='tickets'?'🎫 ガチャチケット ×'+r.n:'💜 SR確定チケット ×1'} を受け取りました</p><p class="small muted" style="margin:0">${S.login.streak}日連続ログイン中。7日目はSR確定チケット！</p><button class="btn primary wide" data-act="mclose">OK</button>`);
      checkAch();save();render();break}
    case 'fortune':{if(D.fortune.revealed)break;D.fortune.revealed=true;S.coins+=20;beep('ok');save();render();break}
    case 'mclaim':{const m=D.missions.find(x=>x.id===t.dataset.id);const d=MISSIONS.find(x=>x.id===m.id);if(m.done||m.p<d.g)break;m.done=true;S.coins+=d.r;beep('up');toast(`ミッション達成！ 🪙${d.r}`);save();render();break}
    case 'mall':{if(D.allBonus||!D.missions.every(m=>m.done))break;D.allBonus=true;S.tickets++;beep('up');toast('全ミッション達成！ 🎫×1');save();render();break}
    case 'daily':startQuiz('daily');break;
    case 'ta':startQuiz('ta');break;
    case 'survival':startQuiz('survival');break;
    case 'practice':startQuiz('practice',t.dataset.cat);break;
    case 'ans':answer(+t.dataset.i);break;
    case 'next':nextQ();break;
    case 'quit':finish();break;
    case 'close':closeQuiz();break;
    case 'again':{const m=Q.mode,c=Q.cat;Q=null;startQuiz(m,c);break}
    case 'zf':zFilter=t.dataset.r;viewZukan();break;
    case 'card':showCard(CARD[t.dataset.id]);break;
    case 'mclose':closeModal();break;
    case 'imgdel':{delete IMG[t.dataset.id];saveImg();toast('画像を外しました');render();showCard(CARD[t.dataset.id]);break}
    case 'pull':pull(t.dataset.k);break;
    case 'sound':S.sound=!S.sound;save();viewRecord();break;
    case 'reset':resetArm=true;viewRecord();break;
    case 'resetno':resetArm=false;viewRecord();break;
    case 'resetyes':{try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(IMG_KEY)}catch(err){}S=fresh();IMG={};resetArm=false;lastPull=null;tab='home';render();toast('データを消しました');break}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='imgIn'&&e.target.files[0])setCardImage(e.target.dataset.id,e.target.files[0])});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(Q&&!$('#quiz').hidden&&!Q.done){const i='1234'.indexOf(e.key);const j='abcd'.indexOf(e.key.toLowerCase());const k=i>=0?i:j;
    if(k>=0&&!Q.locked)answer(k);else if((e.key==='Enter'||e.key===' ')&&Q.locked&&Q.mode!=='ta'){e.preventDefault();nextQ()}}
});
setInterval(()=>{
  if(S.day&&S.day.key!==today()&&!Q){render();toast('日付が変わりました。新しいデイリーが届いています！')}
  else if(tab==='home')tickCountdown();
},1000);

ensureDay();render();loadWP();
if(!S.day.loginClaimed){setTimeout(()=>{const D=S.day;if(D.loginClaimed)return;const r=LOGIN[D.loginIdx];
  openModal(`<div style="font-size:48px">${r.ic}</div><h3>ログインボーナス</h3><p style="margin:0">今日は${D.loginIdx+1}日目。${r.t==='coins'?'🪙'+r.n+' コイン':r.t==='tickets'?'🎫 ガチャチケット ×'+r.n:'💜 SR確定チケット'}がもらえます。</p><button class="btn alert wide" data-act="login">受け取る</button>`)},400)}
</script>
</body></html>
