<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>全力土下座</title>
<meta name="description" content="長押しで謝罪力を溜めて、離して土下座。強すぎるとブラジルまで突き抜けるおバカゲーム。">
<meta name="theme-color" content="#1b1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1b1430;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
    width:44px;height:44px;border-radius:50%;border:2px solid #fff6;background:#0006;color:#fff;
    font-size:20px;line-height:40px;text-align:center;padding:0;cursor:pointer;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="音のオン・オフ">🔊</button>
<script>
'use strict';
// ====== 画面 ======
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 400, VH = 720, FLOOR = 500, PX = 105, BX = 300;
let W, H, S, OX, OY, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / VW, H / VH); OX = (W - VW * S) / 2; OY = (H - VH * S) / 2;
}
addEventListener('resize', resize); resize();
const L = () => -OX / S, R = () => (W - OX) / S, T = () => -OY / S, B = () => (H - OY) / S;

const FONT_T = '"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif';
const FONT_B = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif';

// ====== 保存 ======
const store = {
  get(k, d) { try { const v = localStorage.getItem('dogeza.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dogeza.' + k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('best', 0), bestStage = store.get('bestStage', 0);

// ====== 音 ======
let AC = null, muted = store.get('muted', false), hum = null;
const muteBtn = document.getElementById('mute');
function syncMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
syncMute();
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); });
muteBtn.addEventListener('click', e => {
  e.stopPropagation(); muted = !muted; store.set('muted', muted); syncMute();
  if (muted) { stopHum(); try { speechSynthesis.cancel(); } catch (_) {} }
});
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', vol = .12, slide = 0, delay = 0) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function thud(vol = .5) {
  if (muted || !AC) return;
  const t = AC.currentTime, n = AC.sampleRate * .35, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 300; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
  tone(90, .3, 'sine', vol * .8, -50);
}
function startHum() {
  if (muted || !AC) return;
  stopHum();
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = 120; g.gain.value = .05;
  o.connect(g).connect(AC.destination); o.start(); hum = { o, g };
}
function stopHum() { if (hum) { try { hum.o.stop(); } catch (e) {} hum = null; } }
function say(text, rate = 1.25, pitch = 1) {
  if (muted || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = rate; u.pitch = pitch; u.volume = .9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ====== データ ======
const BOSSES = [
  { name: '部長', skin: '#f2c8a2', suit: '#4a5068', hair: 'bald', wall: '#cfd8dc', floor: '#8d7b68', deco: 'office' },
  { name: '社長', skin: '#efc29a', suit: '#25252f', hair: 'wig', stache: true, wall: '#b08b5e', floor: '#7a2e2e', deco: 'ceo' },
  { name: '会長', skin: '#ebc19b', suit: '#5b3a2a', hair: 'white', beard: true, wall: '#e8dcc0', floor: '#c9b77c', deco: 'washitsu' },
  { name: '総理大臣', skin: '#f0c6a0', suit: '#1f2a44', hair: 'side', wall: '#5a1f2a', floor: '#9e1b2b', deco: 'diet' },
  { name: '宇宙人', skin: '#9be37a', suit: '#3a3a74', hair: 'antenna', wall: '#0b0b25', floor: '#4a4a66', deco: 'space' },
  { name: '神', skin: '#ffe9c8', suit: '#fbfbff', hair: 'halo', beard: true, wall: '#bfe6ff', floor: '#ffffff', deco: 'heaven' },
];
const CRIMES = [
  [0, '部長のプリンを食べた'],
  [0, '会議中に寝言で「ママ…」と言った'],
  [0, '部長のデスクで流しそうめんを開催した'],
  [1, '社長のカツラを扇風機で飛ばした'],
  [1, '社内Wi-Fiの名前を「社長のヒミツ」にした'],
  [1, '社用車で回転寿司のレーンに入った'],
  [2, '会長の盆栽をアフロにした'],
  [2, '社運をかけたプレゼンで紙芝居を始めた'],
  [3, '国会でカスタネットを鳴らし続けた'],
  [3, '国の予算で、おでんを全部買った'],
  [4, 'UFOに「月極駐車場」の看板を立てた'],
  [4, '宇宙人の母星をおしゃれカフェにした'],
  [5, '天地創造の設計図に落書きした'],
  [5, '神様のプリンを食べた'],
];
function crimeFor(st) {
  if (st < CRIMES.length) return { boss: CRIMES[st][0], text: CRIMES[st][1] };
  return { boss: 5, text: `またプリンを食べた（${st - CRIMES.length + 2}個目）` };
}
function styleFor(st) {
  if (st < 2) return { name: 'ふつうの土下座', jump: 0, spin: 0, clones: 0, space: false };
  if (st < 4) return { name: 'ジャンピング土下座', jump: 1, spin: 0, clones: 0, space: false };
  if (st < 6) return { name: '回転土下座', jump: 1.1, spin: 1, clones: 0, space: false };
  if (st < 8) return { name: 'トリプルアクセル土下座', jump: 1.4, spin: 3, clones: 0, space: false };
  if (st < 11) return { name: '分身土下座', jump: 1.4, spin: 2, clones: 2, space: false };
  return { name: '大気圏突入土下座', jump: 0, spin: 4, clones: 2, space: true };
}
const LAYERS = [
  { name: '床下', c1: '#6b5a4a', c2: '#4e4035' },
  { name: '地下駐車場', c1: '#55585e', c2: '#3c3f44' },
  { name: '地下鉄のトンネル', c1: '#2d2a33', c2: '#1d1b22' },
  { name: '温泉', c1: '#3f8fb5', c2: '#2a6b8c' },
  { name: 'マントル', c1: '#d2521c', c2: '#9b2a0c' },
  { name: '地球の核', c1: '#ffd34d', c2: '#ff9a1f' },
  { name: 'ブラジル', c1: '#2fa84f', c2: '#1f7a37' },
];
const LAYER_H = 380;
const OK_LINES = ['…まあ、いいだろう', '顔を上げたまえ', 'そ、そこまでせんでも', '許す。床がかわいそうだ', 'うむ。誠意は伝わった'];
const GOD_LINES = ['美しい…！', '涙が止まらん…', '全部許す！昇進だ！', 'ワシも謝りたくなってきた'];
const WEAK_LINES = ['それは会釈だ！', '誠意が見えんなぁ！', 'いまペコリと言ったか？', 'お辞儀の練習かね？'];
const RANKS = [[0, '謝罪ビギナー'], [2, 'ペコペコ新人'], [4, '中堅の謝罪マン'], [6, '土下座係長'], [8, '謝罪部長'], [10, '土下座の鬼'], [13, '謝罪の神'], [15, '神をも謝らせる者']];

// ====== ポーズ ======
const STAND = { hy: 68, tor: 0, th: 0, sh: 0, arm: .15 };
const CROUCH = { hy: 48, tor: .45, th: .95, sh: -.65, arm: -.4 };
const AIR = { hy: 68, tor: -.15, th: .25, sh: -.5, arm: -2.7 };
const DOGEZA = { hy: 20, tor: 1.78, th: 1.35, sh: -1.5, arm: 1.25 };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function lp(a, b, t) { const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], t); return o; }
const pick = a => a[Math.floor(Math.random() * a.length)];

// ====== 状態 ======
let state = 'title', st = 0, lives = 3, score = 0, combo = 0, cleared = 0;
let stT = 0; // 状態に入ってからの秒
let crime, boss = BOSSES[0], style, zone, power = 0, chargeT = 0, speed = 1;
let pose = { ...STAND }, prx = PX, pry = 0, prot = 0, clones = 0;
let anim = null, judge = null, bossMood = 'angry', bossAnger = .5, bossLine = '';
let shake = 0, camY = 0, crash = null, flash = 0;
const parts = [];

function setState(s) { state = s; stT = 0; }
function newGame() { st = 0; lives = 3; score = 0; combo = 0; cleared = 0; setupStage(); }
function setupStage() {
  crime = crimeFor(st); boss = BOSSES[crime.boss]; style = styleFor(st);
  const w = Math.max(7, 26 - st * 1.4);
  const c = 40 + Math.random() * (88 - w / 2 - 40);
  zone = { lo: c - w / 2, hi: c + w / 2, c };
  speed = .75 + st * .09;
  power = 0; pose = { ...STAND }; pry = 0; prot = 0; clones = 0; camY = 0; crash = null; judge = null;
  bossMood = 'angry'; bossAnger = .45 + Math.min(.5, st * .04); bossLine = pick(['どういうつもりだ！', 'キミィ…！', '説明してもらおうか', 'なんてことを…']);
  setState('intro');
}

// ====== 入力 ======
let holding = false;
function down(vx, vy) {
  ac();
  if (state === 'title') { tone(660, .08); tone(990, .12, 'square', .1, 0, .08); newGame(); return; }
  if (state === 'intro' && stT > .35) { holding = true; chargeT = 0; power = 0; setState('charge'); startHum(); return; }
  if (state === 'result' && stT > .7) { nextStage(); return; }
  if (state === 'over' && stT > 1) {
    if (vy > 560 && vy < 620 && vx > 210 && vx < 360) { share(); return; }
    tone(660, .08); newGame();
  }
}
function up() {
  if (!holding) return;
  holding = false;
  if (state === 'charge') release();
}
function toV(e) { return [(e.clientX - OX) / S, (e.clientY - OY) / S]; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); const [x, y] = toV(e); down(x, y); });
addEventListener('pointerup', up); addEventListener('pointercancel', up);
addEventListener('blur', up);
addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  e.preventDefault(); if (e.repeat) return; down(0, 0);
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') up(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

async function share() {
  const text = `全力土下座で「${rankName()}」になった！ スコア${score}・${cleared}件の罪を許された #全力土下座`;
  const url = location.href.split('#')[0];
  try {
    if (navigator.share) { await navigator.share({ title: '全力土下座', text, url }); return; }
    await navigator.clipboard.writeText(text + ' ' + url);
    popText('コピーしました', VW / 2, 540, '#fff', 20);
  } catch (e) {}
}
function rankName() { let r = RANKS[0][1]; for (const [n, name] of RANKS) if (cleared >= n) r = name; return r; }

// ====== 土下座 ======
function release() {
  stopHum();
  const p = power;
  let kind;
  if (p < zone.lo) kind = 'weak';
  else if (p <= zone.hi) kind = 'ok';
  else kind = 'over';
  const acc = kind === 'ok' ? 1 - Math.abs(p - zone.c) / ((zone.hi - zone.lo) / 2) : 0;
  const perfect = kind === 'ok' && acc > .8;
  anim = { kind, p, acc, perfect, t: 0, landed: false,
    dur: kind === 'weak' ? .7 : style.space ? 1.9 : style.jump ? 1.15 : .7 };
  if (kind === 'weak') say('すんません', 1.4, 1.1);
  else say(p > 97 ? '申し訳ございませんでしたぁぁぁぁぁ！' : '申し訳ございませんでしたぁ！', 1.3, 1);
  setState('anim');
}

function updateAnim(dt) {
  const a = anim; a.t += dt; const u = clamp(a.t / a.dur, 0, 1);
  prot = 0; pry = 0; clones = 0;
  if (a.kind === 'weak') {
    const depth = .2 + .45 * (a.p / Math.max(1, zone.lo));
    pose = lp(STAND, DOGEZA, depth * ease(Math.min(1, u * 2)));
    pose.th = lerp(0, .15, u); pose.sh = 0; pose.hy = lerp(68, 64, u);
    if (u >= 1 && !a.landed) { a.landed = true; tone(220, .25, 'square', .1, -100); finish(); }
    return;
  }
  const land = style.space ? .78 : style.jump ? .72 : .45;
  if (u < land) {
    if (style.space) {
      const v = u / land;
      pose = lp(AIR, DOGEZA, ease(v));
      pry = -900 * Math.pow(1 - v, 2);
      prot = style.spin * Math.PI * 2 * ease(v);
      clones = style.clones;
      if (Math.random() < .8) parts.push({ x: PX + rnd(20), y: FLOOR - 60 + pry + rnd(20), vx: rnd(30), vy: -120 - Math.random() * 80, life: .5, max: .5, c: pick(['#ff6a00', '#ffcc00', '#ff2a00']), s: 6 + Math.random() * 8 });
    } else if (style.jump) {
      if (u < .15) pose = lp(STAND, CROUCH, ease(u / .15));
      else {
        const v = (u - .15) / (land - .15);
        pose = v < .5 ? lp(CROUCH, AIR, ease(v * 2)) : lp(AIR, DOGEZA, ease((v - .5) * 2));
        pry = -170 * style.jump * Math.sin(Math.PI * v);
        prot = style.spin * Math.PI * 2 * ease(v);
        clones = style.clones;
      }
    } else {
      pose = u < .2 ? lp(STAND, CROUCH, ease(u / .2)) : lp(CROUCH, DOGEZA, ease((u - .2) / (land - .2)));
    }
  } else {
    pose = { ...DOGEZA };
    const v = (u - land) / (1 - land);
    pose.hy = DOGEZA.hy - 6 * Math.sin(Math.PI * Math.min(1, v * 3)) * (a.p / 100);
    if (!a.landed) {
      a.landed = true;
      const f = a.p / 100;
      shake = 6 + 22 * f; thud(.3 + .6 * f); buzz(30 + 80 * f);
      for (let i = 0; i < 18 + 30 * f; i++) parts.push({ x: PX + 50 + rnd(60), y: FLOOR - 2, vx: rnd(260 * f + 60), vy: -Math.random() * (200 * f + 60), g: 600, life: .7, max: .7, c: '#d9cbb5', s: 4 + Math.random() * 6 });
      if (a.kind === 'over') { startCrash(); return; }
    }
    if (u >= 1) finish();
  }
}
function rnd(n) { return (Math.random() * 2 - 1) * n; }

function finish() {
  const a = anim;
  if (a.kind === 'ok') {
    combo++; cleared++;
    const pts = Math.round(100 * (1 + st * .25) * (.5 + .5 * a.acc) * (a.perfect ? 2 : 1) * (1 + .1 * (combo - 1)));
    score += pts;
    bossMood = 'happy'; bossAnger = 0; bossLine = pick(a.perfect ? GOD_LINES : OK_LINES);
    judge = { title: a.perfect ? '神土下座！！' : '許された！', sub: `+${pts}点` + (combo > 1 ? `　${combo}連続` : ''), color: a.perfect ? '#ffd23f' : '#7cf29c', ok: true };
    if (a.perfect) { for (let i = 0; i < 40; i++) parts.push({ x: VW / 2 + rnd(150), y: 300 + rnd(80), vx: rnd(200), vy: -Math.random() * 300, g: 400, life: 1.4, max: 1.4, c: pick(['#ffd23f', '#ff6b9a', '#6bd5ff', '#fff']), s: 4 + Math.random() * 5, star: true }); flash = .5; }
    [523, 659, 784, a.perfect ? 1047 : 0].forEach((f, i) => f && tone(f, .18, 'square', .1, 0, i * .09));
  } else {
    combo = 0; lives--;
    bossMood = 'angry'; bossAnger = 1; bossLine = pick(WEAK_LINES);
    judge = { title: '誠意が足りない！', sub: `謝罪力 ${Math.round(a.p)}%（目標 ${Math.round(zone.lo)}〜${Math.round(zone.hi)}%）`, color: '#ff6b6b', ok: false };
    tone(140, .5, 'sawtooth', .12, -60);
  }
  setState('result');
}

function startCrash() {
  const p = anim.p;
  let idx;
  if (p >= 98) idx = 6;
  else idx = clamp(Math.floor((p - zone.hi) / Math.max(.5, 98 - zone.hi) * 6), 0, 5);
  crash = { idx, t: 0, dur: .6 + idx * .45, y0: 0, y1: idx === 6 ? 7 * LAYER_H + 90 : idx === 0 ? 14 : 30 + idx * LAYER_H + LAYER_H / 2, done: false };
  bossMood = 'shock'; bossLine = 'どこ行った！？';
  tone(600, crash.dur + .3, 'triangle', .12, -560);
  setState('crash');
}
function updateCrash(dt) {
  const c = crash; c.t += dt;
  const u = clamp(c.t / c.dur, 0, 1);
  const y = lerp(c.y0, c.y1, c.idx === 0 ? easeOut(u) : u * u * (3 - 2 * u));
  pose = { ...DOGEZA }; pry = y; prot = c.idx === 6 ? Math.PI * ease(u) : 0;
  camY = y < 40 ? 0 : (y - 40) + Math.min(1, (y - 40) / 200) * 200;
  if (u < 1 && c.idx > 0 && Math.random() < .6) parts.push({ x: PX + 40 + rnd(50), y: FLOOR + y - 30 + rnd(10), vx: rnd(150), vy: -Math.random() * 200, g: 500, life: .5, max: .5, c: LAYERS[Math.min(6, Math.floor(y / LAYER_H))].c1, s: 5 + Math.random() * 6 });
  if (u >= 1 && !c.done) {
    c.done = true; shake = 14; thud(.8); buzz(120);
    if (c.idx === 6) {
      combo++; cleared++;
      const pts = Math.round(300 * (1 + st * .25));
      score += pts;
      judge = { title: 'ブラジルで許された！？', sub: `地球の裏側の人に謝ってしまった　+${pts}点`, color: '#ffe14d', ok: true, brazil: true };
      [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'square', .1, 0, i * .1));
      say('オブリガード！', 1.1, 1.3);
      for (let i = 0; i < 50; i++) parts.push({ x: VW / 2 + rnd(180), y: 260 + camY + rnd(60), vx: rnd(220), vy: -Math.random() * 320, g: 380, life: 1.6, max: 1.6, c: pick(['#ffe14d', '#2fa84f', '#2b5fd9', '#fff']), s: 4 + Math.random() * 5, star: true });
    } else {
      combo = 0; lives--;
      judge = { title: 'やりすぎ！', sub: `${LAYERS[c.idx].name}までめり込んだ（謝罪力 ${Math.round(anim.p)}%）`, color: '#ff9f43', ok: false };
      tone(180, .5, 'sawtooth', .12, -100, .1);
    }
    setTimeout(() => { if (state === 'crash') setState('result'); }, 350);
  }
}

function nextStage() {
  if (lives <= 0) {
    if (score > best) { best = score; store.set('best', best); }
    if (cleared > bestStage) { bestStage = cleared; store.set('bestStage', bestStage); }
    tone(330, .3, 'triangle', .12); tone(262, .5, 'triangle', .12, 0, .3);
    setState('over'); camY = 0; crash = null; pose = { ...DOGEZA }; pry = 0; prot = 0;
    bossMood = 'happy'; bossLine = '';
    return;
  }
  if (judge && judge.ok) st++;
  tone(880, .06); setupStage();
}

function popText(text, x, y, color, size) { parts.push({ x, y, vx: 0, vy: -40, life: 1.2, max: 1.2, text, c: color, s: size }); }

// ====== 更新 ======
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1430'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = rnd(shake), sy = rnd(shake);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (OX + sx * S), DPR * (OY + sy * S));

  ctx.save(); ctx.translate(0, -camY);
  if (crash) drawUnderground(t);
  drawRoom(t);
  if (crash && crash.idx > 0) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(PX + 40, FLOOR + 4, 46, 9, 0, 0, Math.PI * 2); ctx.fill(); }
  drawBoss(t);
  // 分身
  for (let i = clones; i > 0; i--) drawPlayer(pose, PX - i * 28, FLOOR + pry + i * 14, prot - i * .5, .3, i % 2 ? '#ff6b9a' : '#6bd5ff');
  drawPlayer(pose, PX, FLOOR + pry, prot);
  if (state === 'crash' || (crash && camY > 0)) { // 頭の穴を描き足す
    if (crash.idx > 0 && pry > 40) { for (let k = 0; k < 4; k++) seg(PX + 20 + rnd(30), FLOOR + pry - 120 - k * 50 + rnd(10), PX + 20 + rnd(30), FLOOR + pry - 80 - k * 50, 2, '#ffffff66'); }
  }
  drawParts();
  ctx.restore();

  if (state === 'title') return drawTitle(t);
  drawHUD();
  if (state === 'over') return drawOver(t);
  if (camY < 60) drawBubble(bossLine, BX, FLOOR - 290);
  if (state === 'intro' || state === 'charge' || state === 'anim') drawCard();
  if (state === 'intro' || state === 'charge') {
    drawGauge(t);
    if (state === 'intro') {
      const a = .6 + .4 * Math.sin(t * 5);
      ctx.globalAlpha = a; txt('長押しで溜めて、離して土下座！', VW / 2, 672, 16, '#fff', FONT_B, 'center', '#1b1430', 4); ctx.globalAlpha = 1;
    }
  }
  if (state === 'result' && judge) {
    const k = easeOut(Math.min(1, stT * 4));
    ctx.save(); ctx.translate(VW / 2, 360); ctx.scale(.5 + .5 * k, .5 + .5 * k); ctx.rotate((1 - k) * -.3);
    const lines = wrap(judge.title, 360, 40, FONT_T);
    lines.forEach((s, i) => txt(s, 0, (i - (lines.length - 1) / 2) * 46, lines.length > 1 ? 34 : 40, judge.color, FONT_T, 'center', '#1b1430', 9));
    ctx.restore();
    const subs = wrap(judge.sub, 340, 16, FONT_B);
    subs.forEach((s, i) => txt(s, VW / 2, 420 + i * 22, 16, '#fff', FONT_B, 'center', '#1b1430', 5));
    if (stT > .7) { ctx.globalAlpha = .6 + .4 * Math.sin(t * 5); txt(lives <= 0 ? 'タップで結果へ' : judge.ok ? 'タップで次の罪へ' : 'タップでもう一回謝る', VW / 2, 660, 17, '#fff', FONT_B, 'center', '#1b1430', 4); ctx.globalAlpha = 1; }
  }
  if (flash > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}

function drawTitle(t) {
  ctx.fillStyle = '#1b1430cc'; ctx.fillRect(L(), T(), R() - L(), 250 - T());
  const k = 1 + Math.sin(t * 3) * .03;
  ctx.save(); ctx.translate(VW / 2, 120); ctx.scale(k, k); ctx.rotate(-.04);
  txt('全力', -70, -30, 40, '#fff', FONT_T, 'center', '#c0392b', 10);
  txt('土下座', 30, 26, 64, '#ffd23f', FONT_T, 'center', '#c0392b', 12);
  ctx.restore();
  txt('〜 謝罪力をきわめろ 〜', VW / 2, 214, 16, '#fff', FONT_B);
  ctx.fillStyle = '#000a'; rr(30, 548, VW - 60, 132, 16); ctx.fill();
  txt('長押しで謝罪力を溜めて、', VW / 2, 574, 15, '#fff', FONT_B);
  txt('緑のところで離すと許される。', VW / 2, 598, 15, '#fff', FONT_B);
  txt('強すぎると床を突き抜けます。', VW / 2, 622, 15, '#ff9f9f', FONT_B);
  if (best) txt(`ベスト ${best}点（${bestStage}件許された）`, VW / 2, 650, 13, '#ffd23f', FONT_B);
  ctx.globalAlpha = .6 + .4 * Math.sin(t * 5);
  txt('タップでスタート', VW / 2, 700, 20, '#fff', FONT_T, 'center', '#1b1430', 5);
  ctx.globalAlpha = 1;
}

function drawOver(t) {
  ctx.fillStyle = '#1b1430e6'; rr(24, 150, VW - 48, 490, 20); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.stroke();
  txt('胃が限界です', VW / 2, 196, 30, '#ff6b6b', FONT_T);
  txt('あなたの謝罪ランク', VW / 2, 252, 15, '#ccc', FONT_B);
  const k = easeOut(Math.min(1, stT * 2));
  ctx.save(); ctx.translate(VW / 2, 300); ctx.scale(k, k);
  txt(rankName(), 0, 0, 34, '#ffd23f', FONT_T, 'center', '#c0392b', 8); ctx.restore();
  txt(`スコア ${score}点`, VW / 2, 372, 24, '#fff', FONT_T);
  txt(`許された罪：${cleared}件`, VW / 2, 412, 16, '#fff', FONT_B);
  txt(`ベスト ${best}点`, VW / 2, 440, 14, '#ffd23f', FONT_B);
  if (score >= best && score > 0) txt('NEW RECORD!', VW / 2, 470, 18, '#7cf29c', FONT_T);
  ctx.fillStyle = '#c0392b'; rr(40, 560, 150, 56, 14); ctx.fill(); txt('もう一回謝る', 115, 588, 17, '#fff', FONT_T);
  ctx.fillStyle = '#2b5fd9'; rr(210, 560, 150, 56, 14); ctx.fill(); txt('シェア', 285, 588, 18, '#fff', FONT_T);
}

requestAnimationFrame(frame);
</script>
