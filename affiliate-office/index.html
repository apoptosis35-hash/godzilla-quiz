<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIアフィリエイト事務所 — 仮想オフィス</title>
<link rel="stylesheet" href="office.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🏢 AIアフィリエイト事務所 <small id="mode">接続中…</small></div>
  <div class="office-level" id="office-level" title="事務所レベル">
    <div class="ol-main"><span class="ol-lv" id="ol-lv">Lv.1</span><span class="ol-name" id="ol-name">スタートアップ</span></div>
    <div class="ol-bar"><i id="ol-fill"></i></div>
    <small class="ol-next" id="ol-next">次のレベルまで —</small>
  </div>
  <div class="kpis">
    <div class="kpi"><span>公開記事</span><b id="k-articles">0</b></div>
    <div class="kpi"><span>クリック</span><b id="k-clicks">0</b></div>
    <div class="kpi"><span>成約</span><b id="k-conversions">0</b></div>
    <div class="kpi"><span>報酬</span><b id="k-revenue">¥0</b></div>
    <div class="kpi"><span>EPC</span><b id="k-epc">¥0</b></div>
  </div>
  <div class="links"><a href="site/" target="_blank">📰 記事サイト</a><button id="toggle">デモ再生</button></div>
</header>
<div class="wrap">
  <div class="floor" id="floor">
    <div class="window w1"></div><div class="window w2"></div><div class="window w3"></div>
    <div class="board" id="board"><div class="board-title">📋 業務フロー</div>
      <div class="flow">調査 → 企画 → 執筆 → 校閲 → 公開 → 分析 ↺</div>
      <div class="board-note" id="board-note">—</div></div>
    <div class="clock" id="clock">--:--</div>
    <div class="meeting"><div class="table"></div><span>会議テーブル</span></div>
    <div class="plant p1">🌱</div><div class="plant p2">🌿</div><div class="coffee">☕<span>コーヒー</span></div>
  </div>
  <aside class="side">
    <h2>👥 スタッフ</h2>
    <ul id="staff"></ul>
    <h2>📜 業務ログ</h2>
    <ol id="log"></ol>
  </aside>
</div>
<div class="toasts" id="toasts"></div>
<script src="office.js"></script>
</body>
</html>
