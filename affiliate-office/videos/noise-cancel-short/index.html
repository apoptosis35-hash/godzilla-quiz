  :root { --navy: #1F2937; --ink: #111827; --amber: #F59E0B; --cream: #FAFAF7; --red: #E4572E; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--navy); }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--navy);
    font-family: 'NSJP', sans-serif; color: #fff; font-feature-settings: "palt"; }
  .layer { position: absolute; inset: 0; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .big { font-weight: 900; line-height: 1.12; letter-spacing: -0.01em; }
  .line { display: block; white-space: nowrap; }
  .mask { display: block; overflow: hidden; padding: 0.04em 0.1em 0.12em; }
  .sub { font-weight: 500; font-size: 50px; line-height: 1.5; }

  /* 広告表示（全編） */
  #pr { position: absolute; left: 64px; top: 72px; z-index: 50; font-weight: 900; font-size: 34px; letter-spacing: 0.06em;
    color: var(--ink); background: var(--amber); padding: 6px 20px 8px; border-radius: 10px; }

  /* 1. ざわざわ → 静か */
  #s-hook { background: var(--navy); }
  #wave { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #hookText { position: absolute; left: 0; right: 0; top: 360px; font-size: 128px; }
  #calmText { position: absolute; left: 0; right: 0; top: 360px; font-size: 150px; color: var(--cream); }
  .noise { position: absolute; font-weight: 900; font-size: 92px; color: var(--amber); white-space: nowrap; }
  #nc { position: absolute; left: 50%; top: 1500px; width: 360px; height: 150px; margin-left: -180px; border-radius: 75px;
    background: #374151; box-shadow: inset 0 0 0 6px #4B5563; }
  #ncKnob { position: absolute; left: 15px; top: 15px; width: 120px; height: 120px; border-radius: 50%; background: #fff; }
  #ncLabel, #ncLabelOn { position: absolute; left: 0; right: 0; top: 1690px; text-align: center; font-weight: 900; font-size: 54px; letter-spacing: 0.08em; color: #9CA3AF; }
  #ncLabelOn { color: var(--amber); }

  /* 2. リスト */
  #s-list { background: var(--cream); color: var(--ink); }
  #listTitle { position: absolute; left: 0; right: 0; top: 640px; font-size: 150px; }
  #listTitle .four { color: var(--amber); }
  #listCount { position: absolute; left: 0; right: 0; top: 1060px; text-align: center; font-weight: 900; font-size: 64px; }
  #listCount b { display: inline-block; background: var(--ink); color: var(--amber); padding: 4px 28px 10px; border-radius: 14px; margin: 0 6px; }
  .card { position: absolute; inset: 0; }
  .card .num { position: absolute; right: -40px; top: 180px; font-family: 'NSJP', sans-serif; font-weight: 900; font-size: 720px; line-height: 1;
    color: rgba(17,24,39,0.07); letter-spacing: -0.06em; }
  .card .tag { position: absolute; left: 96px; top: 560px; font-weight: 900; font-size: 46px; color: var(--amber); letter-spacing: 0.08em; }
  .card .word { position: absolute; left: 90px; right: 60px; top: 640px; font-size: 190px; text-align: left; }
  .card .word .mask { text-align: left; }
  .card .word .line.hl { display: inline-block; }
  .card .word .hl { background: linear-gradient(transparent 62%, rgba(245,158,11,0.55) 62%); }
  .card .s { position: absolute; left: 96px; right: 80px; top: 1130px; font-size: 58px; font-weight: 500; color: #374151; }
  #dots { position: absolute; left: 96px; top: 1460px; display: flex; gap: 22px; }
  #dots i { display: block; width: 120px; height: 16px; border-radius: 8px; background: rgba(17,24,39,0.12); overflow: hidden; }
  #dots i b { display: block; width: 100%; height: 100%; background: var(--ink); transform-origin: left center; transform: scaleX(0); }
  #wipe { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--amber); transform-origin: left center; transform: scaleX(0); z-index: 20; }

  /* 3. 正直な注意 */
  #s-honest { background: var(--ink); }
  #honestPre { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font-weight: 900; font-size: 64px; color: var(--amber); letter-spacing: 0.1em; }
  #honestText { position: absolute; left: 0; right: 0; top: 680px; font-size: 128px; }
  #honestSub { position: absolute; left: 0; right: 0; top: 1060px; text-align: center; color: #D1D5DB; }

  /* 4. 締め */
  #s-end { background: var(--cream); color: var(--ink); }
  #endLine { position: absolute; left: 0; right: 0; top: 600px; font-size: 104px; }
  #siteBadge { position: absolute; left: 50%; top: 1080px; transform: translateX(-50%); white-space: nowrap; font-weight: 900; font-size: 64px;
    background: var(--navy); color: #fff; padding: 22px 48px 28px; border-radius: 22px; }
  #cta { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; font-weight: 900; font-size: 52px; color: var(--ink); }
  #cta .arrow { display: inline-block; color: var(--amber); }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-start="0" data-width="1080" data-height="1920">
  <audio id="om-sound" src="assets/sound.wav" data-start="0" data-duration="15.5" data-track-index="8" data-volume="1"></audio>

  <section class="layer" id="s-hook" data-om-id="hook-scene">
    <canvas id="wave" width="1080" height="1920" data-om-id="wave" data-layout-allow-overflow></canvas>
    <div class="noise" data-om-id="noise-1" style="left:90px; top:930px">ガヤガヤ</div>
    <div class="noise" data-om-id="noise-2" style="left:600px; top:780px">ブーン</div>
    <div class="noise" data-om-id="noise-3" style="left:520px; top:1290px">ピンポーン</div>
    <div class="noise" data-om-id="noise-4" style="left:140px; top:1180px">ドンドン</div>
    <div id="hookText" class="big center" data-om-id="hook" data-om-var="hook"></div>
    <div id="calmText" class="big center" data-om-id="calm" data-om-var="calm"></div>
    <div id="nc" data-om-id="nc-switch"><div id="ncKnob"></div></div>
    <div id="ncLabel" data-om-id="nc-label">ノイズキャンセリング OFF</div>
    <div id="ncLabelOn" data-om-id="nc-label-on">ノイズキャンセリング ON</div>
  </section>

  <section class="layer" id="s-list" data-om-id="list-scene">
    <div id="listTitle" class="big center" data-om-id="list-title" data-om-var="listTitle"></div>
    <div id="listCount" data-om-id="list-count">見るのは <b>4つ</b> だけ</div>
    <div id="cards"></div>
    <div id="dots" data-om-id="progress"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>

  </section>

  <section class="layer" id="s-honest" data-om-id="honest-scene">
    <div id="honestPre" data-om-id="honest-pre">ただし</div>
    <div id="honestText" class="big center" data-om-id="honest" data-om-var="honest"></div>
    <div id="honestSub" class="sub" data-om-id="honest-sub" data-var-text="honestSub"></div>
  </section>

  <section class="layer" id="s-end" data-om-id="end-scene">
    <div id="endLine" class="big center" data-om-id="end-line" data-om-var="endLine"></div>
    <div id="siteBadge" data-om-id="site" data-var-text="site"></div>
    <div id="cta" data-om-id="cta"><span data-var-text="cta"></span> <span class="arrow">↗</span></div>
  </section>

  <div id="pr" data-om-id="pr">PR</div>
</div>

<script>
  const V = OM.vars();
  const $ = (s) => document.querySelector(s);
  const B = (n) => OM.beat(n);
  OM.music({ product: 'consumer', bpm: 120, drop: 'list' });

  // 「|」で改行した大見出しを、行ごとのマスクに組む
  function lines(el, text, cls = '') {
    el.innerHTML = String(text).split('|').map((l) => `<span class="mask"><span class="line ${cls}">${l}</span></span>`).join('');
    return el.querySelectorAll('.line');
  }
  const hookLines = lines($('#hookText'), V.hook);
  const calmLines = lines($('#calmText'), V.calm);
  const titleLines = lines($('#listTitle'), V.listTitle);
  const honestLines = lines($('#honestText'), V.honest);
  const endLines = lines($('#endLine'), V.endLine);

  // ポイントのカード
  const pts = [[V.p1, V.p1s], [V.p2, V.p2s], [V.p3, V.p3s], [V.p4, V.p4s]];
  const cards = pts.map(([w, s], i) => {
    const c = document.createElement('div');
    c.className = 'card'; c.dataset.omId = `point-${i + 1}`;
    c.innerHTML = `<div class="num">0${i + 1}</div><div class="tag">POINT 0${i + 1}</div>
      <div class="word big" data-om-id="point-${i + 1}-word"></div><div class="s" data-om-id="point-${i + 1}-sub">${s}</div>`;
    $('#cards').appendChild(c);
    lines(c.querySelector('.word'), w, 'hl');
    return c;
  });

  // ざわざわの波形：振幅 amp(t) は時間だけの関数
  const ctx = $('#wave').getContext('2d');
  const CALM_AT = B(4);                    // NC ON（2.0 s）
  function amp(t) {
    if (t < CALM_AT) return 1 + 0.25 * Math.sin(t * 9);
    const k = Math.min(1, (t - CALM_AT) / 0.55);
    return 0.03 + 0.97 * Math.pow(1 - k, 3);
  }
  function drawWave(t) {
    ctx.clearRect(0, 0, 1080, 1920);
    const a = amp(t);
    for (let layer = 0; layer < 3; layer++) {
      ctx.beginPath();
      const y0 = 1060 + layer * 26;
      for (let x = -10; x <= 1090; x += 6) {
        const n = Math.sin(x * 0.031 + t * 23 + layer) * 0.5 + Math.sin(x * 0.077 - t * 31 + layer * 2) * 0.35
                + Math.sin(x * 0.173 + t * 47) * 0.25 + Math.sin(x * 0.011 + t * 5) * 0.4;
        const y = y0 + n * 190 * a * (1 - layer * 0.25);
        x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = layer === 0 ? '#F59E0B' : layer === 1 ? 'rgba(245,158,11,0.45)' : 'rgba(250,250,247,0.25)';
      ctx.lineWidth = layer === 0 ? 10 : 6;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
  }

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  OM.clock(tl, drawWave, B(8));   // 波形は冒頭の場面（0〜4 s）だけ

  // 隠した状態から始める
  gsap.set(['#s-list', '#s-honest', '#s-end'], { autoAlpha: 0 });
  gsap.set(calmLines, { yPercent: 140 });
  gsap.set(cards, { autoAlpha: 0 });
  gsap.set('#ncLabelOn', { autoAlpha: 0 });
  gsap.set(['#listCount', '#dots', '#honestPre', '#honestSub', '#siteBadge', '#cta'], { autoAlpha: 0 });

  // ── 1. 冒頭：うるさい在宅ワーク（0 s が表紙：問いかけと波形がもう見えている）
  tl.addLabel('scene:hook', 0);
  tl.fromTo('#hookText', { scale: 1.12 }, { scale: 1, duration: 0.6, ease: 'expo.out' }, 0);
  OM.sfx('impact', 0.02, { gain: 0.6 });
  document.querySelectorAll('.noise').forEach((el, i) => {
    const at = 0.25 + i * 0.32;
    tl.fromTo(el, { scale: 0, rotation: (i % 2 ? 14 : -14) }, { scale: 1, rotation: (i % 2 ? -6 : 6), duration: 0.35, ease: 'back.out(3)', immediateRender: false }, at);
    tl.to(el, { x: (i % 2 ? 10 : -10), duration: 0.08, repeat: 7, yoyo: true, ease: 'none' }, at + 0.35);
    OM.sfx('pop', at, { note: i + 1, gain: 0.7 });
  });
  gsap.set('.noise', { scale: 0 });
  // NC ON
  tl.to('#ncKnob', { x: 210, duration: 0.25, ease: 'power2.inOut' }, CALM_AT - 0.25);
  tl.to('#nc', { backgroundColor: '#F59E0B', boxShadow: 'inset 0 0 0 6px #FBBF24', duration: 0.25 }, CALM_AT - 0.25);
  tl.set('#ncLabel', { autoAlpha: 0 }, CALM_AT);
  tl.set('#ncLabelOn', { autoAlpha: 1 }, CALM_AT);
  OM.sfx('click', CALM_AT - 0.05, { gain: 0.9 });
  OM.sfx('subdrop', CALM_AT, { dur: 0.8, gain: 0.7 });
  tl.to('.noise', { scale: 0.2, autoAlpha: 0, duration: 0.4, ease: 'power2.in', stagger: 0.03 }, CALM_AT);
  tl.to(hookLines, { yPercent: -140, duration: 0.4, ease: 'power3.in', stagger: 0.04 }, CALM_AT);
  tl.to(calmLines, { yPercent: 0, duration: 0.7, ease: 'expo.out', stagger: 0.08 }, CALM_AT + 0.35);
  tl.to('#s-hook', { backgroundColor: '#0F172A', duration: 0.6, ease: 'none' }, CALM_AT);

  // ── 2. 選び方 4つ
  const LIST_AT = B(7);                    // 3.5 s
  tl.addLabel('scene:list', LIST_AT);
  tl.fromTo('#wipe', { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: 'power3.in', immediateRender: false }, LIST_AT - 0.28);
  OM.sfx('whoosh', LIST_AT, { gain: 0.7 });
  tl.set('#s-list', { autoAlpha: 1 }, LIST_AT);
  tl.set('#s-hook', { autoAlpha: 0 }, LIST_AT);
  tl.set('#wipe', { transformOrigin: 'right center' }, LIST_AT);
  tl.to('#wipe', { scaleX: 0, duration: 0.35, ease: 'power3.out' }, LIST_AT);
  tl.fromTo(titleLines, { yPercent: 140 }, { yPercent: 0, duration: 0.55, ease: 'expo.out', stagger: 0.08, immediateRender: false }, LIST_AT + 0.05);
  tl.fromTo('#listCount', { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.4, immediateRender: false }, LIST_AT + 0.45);
  OM.sfx('stamp', LIST_AT + 0.5, { gain: 0.8 });

  const P0 = B(10);                        // 5.0 s から 1.25 s ごと
  const STEP = B(2.5);
  tl.to(['#listTitle', '#listCount'], { autoAlpha: 0, y: -60, duration: 0.25, ease: 'power2.in' }, P0 - 0.25);
  tl.set('#dots', { autoAlpha: 1 }, P0);
  cards.forEach((c, i) => {
    const at = P0 + i * STEP;
    tl.addLabel(`scene:point-${i + 1}`, at);
    if (i > 0) tl.to(cards[i - 1], { autoAlpha: 0, x: -120, duration: 0.2, ease: 'power2.in' }, at - 0.2);
    tl.set(c, { autoAlpha: 1, x: 0 }, at);
    tl.fromTo(c.querySelectorAll('.word .line'), { yPercent: 140 }, { yPercent: 0, duration: 0.45, ease: 'expo.out', stagger: 0.06, immediateRender: false }, at);
    tl.fromTo(c.querySelector('.num'), { x: 200, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.6, immediateRender: false }, at);
    tl.fromTo(c.querySelector('.tag'), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.3, immediateRender: false }, at + 0.05);
    tl.fromTo(c.querySelector('.s'), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.35, immediateRender: false }, at + 0.3);
    tl.to(`#dots i:nth-child(${i + 1}) b`, { scaleX: 1, duration: 0.4, ease: 'power2.out' }, at);
    OM.sfx('thud', at, { gain: 0.8 });
    OM.sfx('tick', at + 0.3, { gain: 0.5 });
  });

  // ── 3. 正直な注意
  const H_AT = P0 + 4 * STEP;              // 10.0 s
  tl.addLabel('scene:honest', H_AT);
  tl.set('#s-honest', { autoAlpha: 1 }, H_AT);
  tl.set('#s-list', { autoAlpha: 0 }, H_AT);
  OM.sfx('hit', H_AT, { gain: 0.7 });
  tl.fromTo('#honestPre', { autoAlpha: 0, scale: 1.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, H_AT);
  tl.fromTo(honestLines, { yPercent: 140 }, { yPercent: 0, duration: 0.55, ease: 'expo.out', stagger: 0.1, immediateRender: false }, H_AT + 0.25);
  OM.sfx('thud', H_AT + 0.3, { gain: 0.6 });
  tl.fromTo('#honestSub', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.4, immediateRender: false }, H_AT + 0.75);
  tl.fromTo('#honestText', { scale: 1 }, { scale: 1.06, duration: B(5) - 0.3, ease: 'none', immediateRender: false }, H_AT + 0.3);   // 読ませる間も、ゆっくり寄る

  // ── 4. 締め
  const E_AT = H_AT + B(5);                // 12.5 s
  tl.addLabel('scene:end', E_AT);
  tl.set('#s-end', { autoAlpha: 1 }, E_AT);
  tl.set('#s-honest', { autoAlpha: 0 }, E_AT);
  tl.fromTo(endLines, { yPercent: 140 }, { yPercent: 0, duration: 0.55, ease: 'expo.out', stagger: 0.1, immediateRender: false }, E_AT);
  tl.fromTo('#siteBadge', { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: 'back.out(2.2)', immediateRender: false }, E_AT + 0.45);
  OM.sfx('chime', E_AT + 0.45, { gain: 0.8 });
  tl.fromTo('#cta', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.4, immediateRender: false }, E_AT + 0.8);
  tl.to('#cta .arrow', { x: 10, y: -10, duration: 0.35, repeat: 3, yoyo: true, ease: 'sine.inOut' }, E_AT + 1.2);
  tl.to({}, { duration: V.endHold }, E_AT + 0.8);

  window.__timelines['film'] = tl;
</script>
</body>
</html>
