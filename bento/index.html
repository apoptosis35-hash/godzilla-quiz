<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おべんとうポン！</title>
<meta name="description" content="おかずを落として合体させる、かわいい物理パズル。">
<meta property="og:type" content="website">
<meta property="og:title" content="おべんとうポン！">
<meta property="og:description" content="おなじおかずをくっつけて、おべんとう王をめざそう！ iPhoneで遊べる無料の物理パズル">
<meta property="og:url" content="https://apoptosis35-hash.github.io/godzilla-quiz/bento/">
<meta property="og:image" content="https://apoptosis35-hash.github.io/godzilla-quiz/bento/icons/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff6e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おべんとうポン">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/matter.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.4" stroke-width="3.4" stroke-dasharray="3.3 3.3"/><circle cx="12" cy="12" r="5.6" stroke-width="3"/></g></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4.5C4 3.7 4.7 3 5.5 3H11v16H5.5A1.5 1.5 0 0 0 4 20.5Zm16 0c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5.7 1.5 1.5ZM5.5 21H11v.5H5.5Zm7.5 0h5.5v.5H13Z"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.2 2.8 11h2.7v9h5v-6h3v6h5v-9h2.7Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10-6.8c.6-.4.6-1.2 0-1.6l-10-6.8C8.9 3.9 8 4.4 8 5.2Z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path fill="currentColor" d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 10H5Z"/></symbol>
</svg>

<div id="app">
  <!-- play screen (always underneath) -->
  <section id="s-game" aria-label="ゲーム">
    <header class="hud">
      <div class="card score-card">
        <div class="lbl">スコア</div>
        <div class="score" id="score">0</div>
        <div class="best"><svg><use href="#i-crown"/></svg><span id="best">0</span></div>
      </div>
      <div class="card combo-card" id="combo-card">
        <div class="lbl">れんさ</div>
        <div class="combo-num" id="combo-num">-</div>
      </div>
      <div class="card next-card">
        <div class="lbl">つぎ</div>
        <canvas id="next-cv" width="96" height="96"></canvas>
      </div>
    </header>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="banners" aria-live="polite"></div>
      <div id="hint" class="hint">ゆびで左右に動かして<br>はなすとポン！</div>
      <div id="fever-frame"></div>
    </div>
    <div id="evo"><canvas id="evo-cv"></canvas></div>
    <nav class="bar">
      <button class="bbtn" id="b-settings"><svg><use href="#i-gear"/></svg><span>設定</span></button>
      <button class="bbtn" id="b-zukan"><svg><use href="#i-book"/></svg><span>図鑑</span></button>
      <button class="bbtn retry" id="b-retry"><svg><use href="#i-retry"/></svg><span id="retry-lbl">リトライ</span></button>
    </nav>
  </section>

  <!-- title -->
  <section id="s-title" class="screen show" aria-label="タイトル">
    <canvas id="title-cv"></canvas>
    <div class="title-wrap">
      <h1 class="logo"><span class="l1">おべんとう</span><span class="l2">ポン<b>！</b></span></h1>
      <p class="tagline">おなじおかずをくっつけて<br>おべんとう王をめざそう！</p>
      <div class="title-rec" id="title-rec"></div>
      <div class="title-btns">
        <button class="btn primary big" id="t-play"><svg><use href="#i-play"/></svg>あそぶ</button>
        <button class="btn" id="t-resume" hidden>つづきから</button>
        <div class="row">
          <button class="btn sub" id="t-zukan"><svg><use href="#i-book"/></svg>図鑑</button>
          <button class="btn sub" id="t-settings"><svg><use href="#i-gear"/></svg>設定</button>
        </div>
        <button class="btn sub" id="t-share"><svg><use href="#i-share"/></svg>友だちにシェア</button>
      </div>
      <p class="install" id="install-tip">Safariの共有ボタン →「ホーム画面に追加」で<br>アプリのように遊べます</p>
    </div>
  </section>

  <!-- game over -->
  <section id="s-over" class="screen modal" aria-label="結果">
    <div class="sheet result">
      <div class="r-head" id="r-head">おしまい！</div>
      <div class="r-new" id="r-new" hidden>ハイスコア更新！</div>
      <div class="r-score" id="r-score">0</div>
      <div class="r-rank" id="r-rank"></div>
      <div class="r-best">ベスト <b id="r-best">0</b></div>
      <div class="r-grid">
        <div><span>最大れんさ</span><b id="r-combo">0</b></div>
        <div><span>合体</span><b id="r-merges">0</b></div>
        <div class="r-top"><span>いちばん大きいおかず</span><canvas id="r-top-cv" width="120" height="120"></canvas><b id="r-top">-</b></div>
      </div>
      <div class="r-disc" id="r-disc" hidden></div>
      <button class="btn primary big" id="o-retry"><svg><use href="#i-retry"/></svg>もう1回！</button>
      <div class="row">
        <button class="btn sub" id="o-title"><svg><use href="#i-home"/></svg>タイトル</button>
        <button class="btn sub" id="o-zukan"><svg><use href="#i-book"/></svg>図鑑</button>
      </div>
      <button class="btn sub" id="o-share"><svg><use href="#i-share"/></svg>スコアをシェア</button>
    </div>
  </section>

  <!-- encyclopedia -->
  <section id="s-zukan" class="screen modal" aria-label="図鑑">
    <div class="sheet tall">
      <div class="sheet-head"><h2>おかず図鑑</h2><span class="z-count" id="z-count"></span><button class="x" data-close aria-label="とじる"><svg><use href="#i-close"/></svg></button></div>
      <div class="z-list" id="z-list"></div>
      <div class="z-detail" id="z-detail"></div>
    </div>
  </section>

  <!-- settings -->
  <section id="s-settings" class="screen modal" aria-label="設定">
    <div class="sheet">
      <div class="sheet-head"><h2>設定</h2><button class="x" data-close aria-label="とじる"><svg><use href="#i-close"/></svg></button></div>
      <div class="set-list">
        <label class="set"><span>BGM</span><input type="checkbox" class="tog" id="set-bgm"></label>
        <label class="set"><span>効果音</span><input type="checkbox" class="tog" id="set-se"></label>
        <label class="set"><span>振動 <small>(対応端末)</small></span><input type="checkbox" class="tog" id="set-vib"></label>
        <label class="set"><span>画面のゆれ</span><input type="checkbox" class="tog" id="set-shake"></label>
        <label class="set"><span>演出をひかえめに</span><input type="checkbox" class="tog" id="set-fx"></label>
      </div>
      <div class="set-stats" id="set-stats"></div>
      <div class="set-actions">
        <button class="btn sub" id="set-title"><svg><use href="#i-home"/></svg>タイトルへ</button>
        <button class="btn danger" id="set-reset">記録を消す</button>
      </div>
      <p class="credit">おべんとうポン！ v1.1 ・ キャラクター/効果音/BGMはすべてプログラムで作ったオリジナルです。物理演算: Matter.js (MIT)</p>
    </div>
  </section>

  <!-- in-app confirm -->
  <section id="s-confirm" class="screen modal" aria-label="確認">
    <div class="sheet small">
      <p id="c-msg"></p>
      <div class="row"><button class="btn sub" id="c-no">やめる</button><button class="btn danger" id="c-yes">OK</button></div>
    </div>
  </section>

  <div id="toast" role="status"></div>
  <div id="rotate-tip">縦向きのほうが遊びやすいよ</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
