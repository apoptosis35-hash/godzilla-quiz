<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff7e6">
<canvas id="c"></canvas>
<script type="module">
import { drawChar, EXPRESSIONS } from '../js/chars.js';
import { TIERS } from '../js/config.js';
const c = document.getElementById('c'), cell = 130;
c.width = cell * EXPRESSIONS.length; c.height = cell * TIERS.length;
const ctx = c.getContext('2d');
TIERS.forEach((t, i) => EXPRESSIONS.forEach((e, j) => {
  ctx.save(); ctx.translate(j * cell + cell / 2, i * cell + cell / 2 + 4);
  drawChar(ctx, i, 46, e); ctx.restore();
}));
document.title = 'done';
</script>
